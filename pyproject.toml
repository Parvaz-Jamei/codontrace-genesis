[build-system]
# Setuptools is used here to keep editable installs lightweight and broadly
# compatible with clean CI/venv environments.
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"codontrace.genesis.rag" = ["corpus/*.jsonl", "corpus/*.md"]
"codontrace.genesis.ilw" = ["INTEGRATION_DAG.json"]

[project]
name = "codontrace"
version = "0.3.0b8"
# Prior identities: version = "0.3.0b4.dev0", version = "0.3.0b4.dev1", version = "0.3.0b4", version = "0.3.0b5", version = "0.3.0b6", version = "0.3.0b7".
# Public cuts 0.3.0b4, 0.3.0b5, 0.3.0b6, and 0.3.0b7 are immutable. Do not recut them.
description = "CodonTrace Genesis: deterministic research-beta engine for digital evolution, causal mechanism auditing, capsule-mediated transfer, skill compression, role emergence, and replayable evidence artifacts."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Parvaz Jamei" }
]
keywords = [
  "python",
  "white-box-agents",
  "codontrace-genesis",
  "causal-mechanisms",
  "semantic-genomes",
  "digital-evolution",
  "quality-diversity",
  "open-endedness",
  "deterministic-simulation",
  "explainable-ai"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10",
  "ruff>=0.15,<1",
  "mypy>=2.0,<3",
  "build>=1.5,<2",
  "twine>=6.2,<7",
  "pip-audit>=2.10,<3",
  "hypothesis>=6.0,<7",
  "pydantic>=2.0,<3"
]
science = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
]
qd = [
  "numpy>=2.0,<3",
  "ribs>=0.10,<1",
]
research = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "ribs>=0.10,<1",
  "networkx>=3.0,<4",
  "pandas>=2.0,<3",
]
causal = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
]

[project.urls]
Homepage = "https://github.com/Parvaz-Jamei/codontrace-genesis"
Repository = "https://github.com/Parvaz-Jamei/codontrace-genesis"
Issues = "https://github.com/Parvaz-Jamei/codontrace-genesis/issues"
Documentation = "https://github.com/Parvaz-Jamei/codontrace-genesis/tree/main/docs"
Changelog = "https://github.com/Parvaz-Jamei/codontrace-genesis/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --disable-plugin-autoload --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  "E501",
  "UP042",
  "B017",
  "B023",
  "E402",
  "E701",
  "E702",
  "SIM102",
  "SIM108",
  "SIM113",
  "SIM118",
  "SIM210",
  "SIM401",
  "SIM103",
  "SIM105",
  "SIM101",
]

[tool.ruff.lint.per-file-ignores]
"src/codontrace/__init__.py" = ["F401"]
"src/codontrace/genesis/__init__.py" = ["F401", "E402", "F811"]
"tests/**" = ["SIM", "B009", "B905"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["codontrace"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true


# Tests exercise dynamic JSON/public API boundaries. Package source remains
# fully strict under `mypy --strict src`; the test package keeps focused
# relaxations so the requested `mypy --strict src tests` gate is portable.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disable_error_code = [
  "arg-type",
  "attr-defined",
  "call-arg",
  "no-untyped-call",
  "no-untyped-def",
  "no-any-return",
  "import-not-found",
  "dict-item",
  "call-overload",
  "index",
  "misc",
  "operator",
  "union-attr",
  "unused-ignore",
  "var-annotated",
]

name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  ubuntu-full-tests:
    name: Full pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Plain runs took 12-31 min and the 3.14 coverage run 24 min on
    # ubuntu-latest (runs 39653320109, 39663305983); 75 leaves headroom
    # without letting a hung job idle for hours.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Compile package, tests, examples, and tools
        run: python -m compileall -q src tests examples tools

      - name: Enforce core boundary with AST import guard
        run: python tools/check_core_boundary.py

      - name: Reject probe leftovers in the checkout
        run: |
          python - <<'PY'
          import fnmatch
          from pathlib import Path

          skip_parts = {".git", ".venv", "venv", "__pycache__"}

          def is_leftover(path: Path) -> bool:
              name = path.name
              if name.startswith(".grok_write_probe"):
                  return True
              if name.startswith(".size_test_") and path.suffix == ".txt":
                  return True
              return any(
                  fnmatch.fnmatch(name, pattern)
                  for pattern in ("*_FULL_RESTORE*", "*_backup*", "*.orig")
              )

          junk = sorted(
              p
              for p in Path(".").rglob("*")
              if p.is_file()
              and skip_parts.isdisjoint(p.parts)
              and is_leftover(p)
          )
          if junk:
              raise SystemExit("probe leftovers must not ship: " + ", ".join(map(str, junk)))
          print("no probe leftovers")
          PY

      # pytest-xdist and pytest-cov are loaded explicitly with -p because
      # --disable-plugin-autoload keeps every other entry-point plugin out.
      #
      # Coverage is collected on Python 3.14 only. coverage.py's sys.monitoring
      # core ("sysmon") is the default on 3.14 and supports branch coverage
      # there; on 3.12 and 3.13 sysmon does not support branch coverage, and
      # the settrace core made those jobs take 58-60 min (run 39663305983,
      # 3.13 cancelled at the timeout). The other versions run the same full
      # suite without coverage.
      # https://coverage.readthedocs.io/en/latest/config.html#config-run-core
      - name: Run full test suite
        if: matrix.python-version != '3.14'
        run: python -m pytest tests --disable-plugin-autoload -p xdist -n auto

      - name: Run full test suite with branch coverage
        if: matrix.python-version == '3.14'
        env:
          COVERAGE_CORE: sysmon
        run: >
          python -m pytest tests --disable-plugin-autoload
          -p xdist -p pytest_cov -n auto
          --cov=codontrace --cov-branch
          --cov-report=term --cov-report=xml:coverage.xml

      - name: Coverage summary
        if: always() && matrix.python-version == '3.14'
        run: |
          if [ -f .coverage ]; then
            {
              echo "### Coverage (Python ${{ matrix.python-version }}, line + branch, sysmon core)"
              echo '```'
              python -m coverage report --format=total
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always() && matrix.python-version == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  core-smoke-cross-os:
    name: Core smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]" pytest

      - name: Compile package, tests, examples, and tools
        run: python -m compileall -q src tests examples tools

      - name: Enforce core boundary with AST import guard
        run: python tools/check_core_boundary.py

      - name: Run release-critical tests
        run: python -m pytest tests/test_export_import.py tests/test_console_status_lock.py tests/test_pause_handshake.py tests/test_api_signature.py tests/test_genesis_causal_mechanism_hardening.py tests/test_genesis_causal_mechanism_runtime_wiring_integrity.py tests/test_genesis_integration_public_api_unification.py tests/test_genesis_integration_runtime_wiring.py tests/test_genesis_eval_bugfixes.py tests/release tests/genesis_gates --disable-plugin-autoload

  lint-type:
    name: Lint and typecheck (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint and typecheck dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Mypy
        run: python -m mypy --strict --platform linux src

      - name: Import contracts (import-linter)
        run: lint-imports --no-cache

  verdict-ledger:
    name: Standing verdict ledger (required; not optional)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Ledger matches the index
        run: python -m pytest tests/test_verdict_ledger.py --disable-plugin-autoload

  causal-oracle:
    name: Causal identification oracle (y0, required)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: ID and IDC verdicts agree with y0 (no skips)
        env:
          CODONTRACE_REQUIRE_Y0: "1"
        run: python -m pytest tests/causal_inference --disable-plugin-autoload -p xdist -n auto

  published-manifests:
    name: Published manifests and energy property (required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]" pytest

      - name: Manifests match and the energy property is not skipped
        run: >
          python -m pytest
          tests/test_published_manifests.py
          tests/test_archive_jsonl.py
          tests/test_antagonist_energy_accounting.py::test_hypothesis_is_installed_for_the_energy_property
          tests/test_antagonist_energy_accounting.py::test_property_balance_identity_and_parents
          --disable-plugin-autoload

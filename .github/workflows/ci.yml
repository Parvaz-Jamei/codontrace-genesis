name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  ubuntu-full-tests:
    name: Full pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . pytest

      - name: Compile package, tests, examples, and tools
        run: python -m compileall -q src tests examples tools

      - name: Enforce core boundary with AST import guard
        run: python tools/check_core_boundary.py

      - name: Reject probe leftovers in the checkout
        run: |
          python - <<'PY'
          import fnmatch
          from pathlib import Path

          skip_parts = {".git", ".venv", "venv", "__pycache__"}

          def is_leftover(path: Path) -> bool:
              name = path.name
              if name.startswith(".grok_write_probe"):
                  return True
              if name.startswith(".size_test_") and path.suffix == ".txt":
                  return True
              return any(
                  fnmatch.fnmatch(name, pattern)
                  for pattern in ("*_FULL_RESTORE*", "*_backup*", "*.orig")
              )

          junk = sorted(
              p
              for p in Path(".").rglob("*")
              if p.is_file()
              and skip_parts.isdisjoint(p.parts)
              and is_leftover(p)
          )
          if junk:
              raise SystemExit("probe leftovers must not ship: " + ", ".join(map(str, junk)))
          print("no probe leftovers")
          PY

      - name: Run full test suite
        run: python -m pytest tests --disable-plugin-autoload

  core-smoke-cross-os:
    name: Core smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . pytest

      - name: Compile package, tests, examples, and tools
        run: python -m compileall -q src tests examples tools

      - name: Enforce core boundary with AST import guard
        run: python tools/check_core_boundary.py

      - name: Run release-critical tests
        run: python -m pytest tests/test_export_import.py tests/test_api_signature.py tests/test_genesis_causal_mechanism_hardening.py tests/test_genesis_causal_mechanism_runtime_wiring_integrity.py tests/test_genesis_integration_public_api_unification.py tests/test_genesis_integration_runtime_wiring.py tests/test_genesis_eval_bugfixes.py tests/release tests/genesis_gates --disable-plugin-autoload

  lint-type:
    name: Lint and typecheck (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint and typecheck dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy --strict src
